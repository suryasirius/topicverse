<title>TopicTalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap">
<style>
/* Layout: sticky top bar, centred 1120px column; topic page = discussion column + graph rail; phone = bottom tab bar */
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --ink:#12201B; --muted:#66756F; --line:#E1E8E4;
  --brand:#1F9D63; --brand-deep:#0E7045; --brand-soft:#E3F3EA; --on-brand:#FFFFFF;
  --chip:#EEF2F0; --star:#B87A0B; --danger:#B4412F; --shadow:0 1px 2px rgba(18,32,27,.06),0 4px 14px rgba(18,32,27,.05);
  --tile-l:90%; --tile-ink:26%;
  --f-display:"Bricolage Grotesque","Noto Sans Tamil","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Schibsted Grotesk","Noto Sans Tamil","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1110; --surface:#121A18; --ink:#E6EEEA; --muted:#93A39C; --line:#22302C;
  --brand:#34B57A; --brand-deep:#7FD3A8; --brand-soft:#15302A; --on-brand:#06120D;
  --chip:#1A2421; --star:#E2A93B; --danger:#E58A76; --shadow:0 1px 2px rgba(0,0,0,.4);
  --tile-l:22%; --tile-ink:82%; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1110; --surface:#121A18; --ink:#E6EEEA; --muted:#93A39C; --line:#22302C;
  --brand:#34B57A; --brand-deep:#7FD3A8; --brand-soft:#15302A; --on-brand:#06120D;
  --chip:#1A2421; --star:#E2A93B; --danger:#E58A76; --shadow:0 1px 2px rgba(0,0,0,.4);
  --tile-l:22%; --tile-ink:82%; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;flex-shrink:0}
.logo b{color:var(--brand)}
.logo svg{width:28px;height:28px}
.search{position:relative;flex:1;min-width:0;max-width:520px;margin-inline:auto}
.search input{width:100%;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 44px 0 40px;outline:none;font-size:15px;caret-color:var(--brand)}
.search::after{content:"/";position:absolute;right:12px;top:10px;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);color:var(--muted);font-size:12px;display:grid;place-items:center;pointer-events:none}
.search:focus-within::after{opacity:0}
@media(max-width:720px){.search::after{display:none}.search input{padding-right:16px}}
.search input:focus{border-color:var(--brand)}
.search .ico{position:absolute;left:14px;top:12px;width:18px;height:18px;color:var(--muted)}
.dd{position:absolute;top:48px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;max-height:70vh;overflow:auto}
.dd .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.dd a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px}
.dd a:hover,.dd a.hl{background:var(--chip)}
.navr{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ibtn{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:0;background:transparent;color:var(--ink)}
.ibtn:hover{background:var(--chip)}
.ibtn svg{width:21px;height:21px}
.dot{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:11px;font-weight:700;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.navlink{font-weight:600;padding:8px 12px;border-radius:999px}
.navlink:hover{background:var(--chip)}

/* avatars & tiles */
.av{flex-shrink:0;width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;background:hsl(var(--h,150) 40% var(--tile-l));color:hsl(var(--h,150) 50% var(--tile-ink));object-fit:cover}
.av.lg{width:72px;height:72px;font-size:24px}
.prow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:6px 14px}.prow>a{flex:1;min-width:0}.pbtns{display:flex;gap:6px;flex-wrap:wrap}
.privrow{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.privrow.on{border-color:var(--brand);background:var(--brand-soft)}.privrow input{margin-top:4px}
.mrow{display:flex;gap:8px;align-items:center;padding:6px 0;flex-wrap:wrap}.mrow .nm{flex:1;min-width:120px;font-weight:600}
.banner{margin:0 0 14px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);aspect-ratio:3/1;background:var(--chip)}.banner img{width:100%;height:100%;object-fit:cover;display:block}
.tcard .thumb{width:84px;height:84px;border-radius:12px;object-fit:cover;flex-shrink:0}
.uid{display:inline-block;font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;color:var(--muted);background:var(--brand-soft);border-radius:6px;padding:3px 6px}
.dprow{display:flex;gap:14px;align-items:center;margin-top:6px}
.av.xs{width:22px;height:22px;font-size:10px}
.tile{flex-shrink:0;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;background:hsl(var(--h) 42% var(--tile-l));color:hsl(var(--h) 55% var(--tile-ink))}

main{padding-block:22px 110px}
.banner{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--brand-soft);font-size:14px}

/* home */
.hero{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:18px;padding:12px 0 26px;border-bottom:1px solid var(--line);margin-bottom:26px}
.hero h1{font-size:clamp(32px,5.4vw,54px);font-weight:800;letter-spacing:-.03em;max-width:13ch}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{margin:10px 0 0;color:var(--muted);max-width:46ch;font-size:16px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.sec{margin-bottom:34px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sech h2{font-size:22px;font-weight:700}
.sech a{color:var(--brand-deep);font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px}
@media(max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}.cols>*{min-width:0}}

.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s,transform .15s}
.tcard:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.tcard>a{display:flex;gap:14px;padding:16px;height:100%}
.tcard .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tcard h3{font-size:17px;font-weight:700}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.stats{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;font-variant-numeric:tabular-nums}
.rating{color:var(--star);font-weight:700}
.hot{color:var(--brand-deep);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tagbox{display:flex;flex-wrap:wrap;gap:6px}.tagbox:empty{display:none}
.chip.tg{background:var(--brand-soft,#E3F5EC);color:var(--brand-deep);font-weight:600}.chip.tg button{border:0;background:none;color:inherit;font-size:15px;line-height:1;cursor:pointer;padding:0 0 0 2px}
.tagsug{display:grid;gap:2px;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--surface)}.tagsug[hidden]{display:none!important}
.tagsug .aci{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:inherit;font:inherit}.tagsug .aci:hover{background:var(--chip)}
.withrow{margin-top:10px;font-size:14px;color:var(--muted)}.withrow a{color:var(--brand-deep);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--chip);font-size:12.5px;font-weight:500;color:var(--muted);border:0}
a.chip:hover,button.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg)}
.brmark{color:var(--brand-deep);font-weight:600}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list>*{display:flex;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.list .txt{min-width:0;flex:1}
.list .q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* tree */
.tree{list-style:none;margin:0;padding:0;font-size:14px}
.tree ul{list-style:none;margin:0;padding-left:16px;border-left:1.5px solid var(--line);margin-left:7px}
.tree li{position:relative;padding:3px 0}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:15px;width:12px;border-top:1.5px solid var(--line)}
.tree a{display:inline-block;padding:3px 8px;border-radius:8px}
.tree a:hover{background:var(--chip)}
.tree a.cur{background:var(--brand-soft);color:var(--brand-deep);font-weight:700}
.tree .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

/* topic page */
.tp{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
@media(max-width:900px){.tp{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
@media(max-width:900px){.rail{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-size:15px;margin-bottom:10px}
.lineage{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.lineage a{color:var(--brand-deep);font-weight:600}
.thead{display:flex;gap:16px;align-items:flex-start}
.thead h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.02em}
.thead .tile{width:60px;height:60px;font-size:18px;border-radius:14px}
.origin{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:14px}
.origin q{font-style:italic}
.desc{margin:14px 0 0;max-width:68ch}
.tbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.verdict{display:flex;gap:18px;align-items:center}
.big{font-family:var(--f-display);font-size:42px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:4px;font-size:12px;color:var(--muted);margin-top:12px;font-variant-numeric:tabular-nums}
.bars div{display:grid;grid-template-columns:22px 1fr 34px;gap:8px;align-items:center}
.bars span.b{height:7px;border-radius:9px;background:var(--chip);overflow:hidden}
.bars span.b i{display:block;height:100%;background:var(--star)}
.pc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pc .chip.p{color:var(--brand-deep)}
.pc .chip.c{color:var(--danger)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:28px 0 18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}

.composer{display:flex;gap:10px;align-items:flex-start;margin-bottom:20px}
.composer .box{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
textarea,input.f,select.f{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;outline:none;resize:none;font-size:16px;line-height:1.55;caret-color:var(--brand);transition:border-color .16s ease,box-shadow .16s ease,background-color .16s ease}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.85;transition:opacity .2s ease}
textarea:focus::placeholder,input:focus::placeholder{opacity:.5}
textarea:focus,input.f:focus,select.f:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent)}
::selection{background:color-mix(in srgb,var(--brand) 26%,transparent)}
body{font-kerning:normal;font-variant-ligatures:common-ligatures contextual;text-rendering:optimizeLegibility}
/* rich typing surface: a mirror behind a transparent textarea colours @mentions, #tags and links as you type */
.rt{position:relative;width:100%}
.rt-back,.rt .rt-in{font:inherit;font-size:16px;line-height:1.55;letter-spacing:normal;padding:11px 14px;border:1px solid transparent;border-radius:14px;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;box-sizing:border-box;margin:0}
.rt-back{position:absolute;inset:0;overflow:hidden;color:var(--ink);background:var(--surface);border-color:var(--line);pointer-events:none;transition:border-color .16s ease,box-shadow .16s ease}
.rt .rt-in{position:relative;z-index:1;display:block;background:transparent!important;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--brand);border-color:transparent!important;box-shadow:none!important;min-height:50px}
.rt .rt-in::placeholder{-webkit-text-fill-color:var(--muted);color:var(--muted)}
.rt .rt-in:focus-visible{outline:none}
.rt:focus-within .rt-back{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent)}
.hl-at{color:var(--brand-deep);background:color-mix(in srgb,var(--brand) 13%,transparent);border-radius:5px}
.hl-at.off{color:var(--muted);background:none}
.hl-tag{color:var(--brand-deep)}
.hl-url{color:var(--brand-deep);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--brand) 40%,transparent);text-underline-offset:2px}
.composer .box{gap:6px}
.composer .rt-in{min-height:54px}
.composer:focus-within .rt-in,.composer.keep .rt-in{min-height:92px}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;flex-wrap:wrap}
.ctool{display:flex;align-items:center;gap:4px;min-width:0;flex-wrap:wrap}
.cact{display:flex;gap:6px;align-items:center;margin-left:auto}
.tbtn{width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:15px;display:grid;place-items:center;transition:background .15s,color .15s}
.tbtn:hover{background:var(--chip);color:var(--brand-deep)}
.khint{font-size:12px;color:var(--muted);margin-left:4px;opacity:0;transform:translateY(2px);transition:opacity .2s ease,transform .2s ease}
.composer:focus-within .khint{opacity:1;transform:none}
.dchip{font-size:11.5px;font-weight:600;color:var(--brand-deep);background:var(--brand-soft);padding:2px 8px;border-radius:999px}
.ccount{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ccount.over{color:var(--danger);font-weight:700}
.btn{transition:background-color .15s ease,border-color .15s ease,opacity .2s ease,transform .08s ease}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri.idle{opacity:.45}
.btn.busy::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cmt.rise{animation:rise .42s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ac[hidden],.dd[hidden],.ep[hidden]{display:none!important}
.tbtn svg{display:block}
.tbtn.gifb{width:auto;padding:0 7px;font-size:11px;letter-spacing:.06em;border:1.5px solid currentColor;height:22px;border-radius:6px;margin:0 4px}
.ep{position:fixed;z-index:85;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(10,20,16,.18),0 2px 6px rgba(10,20,16,.06);padding:10px;display:grid;gap:8px;animation:pop .14s ease-out}
.ep-q{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:14px;outline:none;caret-color:var(--brand)}
.ep-q:focus{border-color:var(--brand)}
.ep-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.ep-tab{flex:1 0 auto;min-width:32px;padding:0;height:32px;border:0;border-radius:9px;background:none;font-size:17px;filter:grayscale(.85);opacity:.65;transition:filter .15s,opacity .15s,background .15s}
.ep-tab:hover{opacity:1;filter:none}
.ep-tab.on{background:var(--brand-soft);filter:none;opacity:1}
.ep-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.ep-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;max-height:232px;overflow-y:auto;overscroll-behavior:contain}
.ep-e{aspect-ratio:1;min-width:0;padding:0;border:0;border-radius:9px;background:none;font-size:23px;line-height:1;display:grid;place-items:center;transition:transform .1s ease,background .12s}
.ep-e:hover{background:var(--chip);transform:scale(1.15)}
.ep-e:active{transform:scale(.92)}
.ep-foot{font-size:12px;padding:0 2px}
.ace{font-size:20px;width:24px;text-align:center}
.ctext.big{font-size:36px;line-height:1.2;letter-spacing:2px}
.cmedia{position:relative;display:inline-block;margin-top:8px;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--chip);max-width:100%;cursor:zoom-in}
.cmedia img{display:block;max-width:100%;height:auto;object-fit:cover}
.cmedia.ph{padding:30px 40px;color:var(--muted);font-size:13px;cursor:default}
.gifbadge{position:absolute;left:8px;bottom:8px;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.6);color:#fff}
.attach{display:flex;align-items:center;gap:10px;width:100%;padding:6px;border:1px dashed var(--line);border-radius:12px;font-size:13px;animation:rise .25s ease}
.attach img{width:64px;height:64px;object-fit:cover;border-radius:9px}
@media(max-width:420px){.ep-grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
.ac{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(10,20,16,.16),0 2px 6px rgba(10,20,16,.06);padding:5px;display:grid;gap:1px;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-3px) scale(.98)}}
.aci{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:10px;border:0;background:none;text-align:left;font-size:14px;color:var(--ink);width:100%}
.aci.on,.aci:hover{background:var(--brand-soft)}
.acht{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--brand-deep);font-weight:800;font-size:12px}
.dd mark{background:color-mix(in srgb,var(--brand) 20%,transparent);color:inherit;border-radius:3px}
.dd a.kb{background:var(--chip);box-shadow:inset 2px 0 0 var(--brand)}
.search input{transition:border-color .16s ease,box-shadow .16s ease}
.search input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent)}
@media(max-width:720px){.khint{display:none}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}

.cnt{color:var(--muted);padding:4px 0;border-radius:6px}.cnt b{color:var(--ink)}.cnt:hover,.cnt:active{color:var(--brand-deep);text-decoration:underline}

.prow .who{display:flex;align-items:center;gap:12px;flex:1;min-width:0}.prow .who span{min-width:0}.prow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prow small{color:var(--muted)}
.prow .unf{color:var(--muted);background:none;border:1px solid var(--line)}

.nlist .nrow{position:relative}.nlist .nrow:not(.unread){opacity:.82}.nlist .nrow.unread{background:var(--brand-soft)}.nlist .nrow.unread .txt>div:first-child{font-weight:500}
.ndot{position:absolute;left:5px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--brand)}
.vp{cursor:pointer;display:inline-flex;align-items:center}
.linkb{background:none;border:0;padding:4px 0;color:var(--brand-deep);font-weight:700;font-size:14px;cursor:pointer}
.localfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}.localfoot a{color:var(--brand-deep);font-weight:700;font-size:14px}
.viewing{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-deep);margin-top:6px}
.plres{max-height:46vh;overflow:auto;margin:10px -4px 0}.plh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 4px}

.interp{margin:6px 0 4px;font-size:14px}.interp a{color:var(--brand-deep);font-weight:600}
.locnote{font-size:13px;color:var(--muted);margin-top:8px}.locnote b{color:var(--ink)}
.locsug{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));background:var(--brand-soft);border-radius:12px;font-size:14px}.locsug small{color:var(--muted)}.locsug span:last-child{display:flex;align-items:center;gap:6px;flex:none}
.phead h1{font-size:30px}

.rephow{margin-top:6px}.rephow summary{font-size:13px}
.spk{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px 14px;border:1px solid var(--line,#e2e8e0);border-radius:12px;background:var(--panel,#f4f8f2);color:var(--ink);text-decoration:none;cursor:pointer}
.spk .sp-i{font-size:22px}.spk b{display:block;font-size:15px}.spk small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}

.kpis b{display:block;font-family:var(--f-display);font-size:24px;color:var(--ink);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}

/* ---- home hierarchy (round 1) ---- */
.tlink{color:var(--brand-deep);font-weight:700;font-size:15px;padding:10px 6px;align-self:center}
.tlink:hover{text-decoration:underline}
.sech h2{font-size:24px}
.sech .sub{color:var(--muted);font-size:14px;margin-top:2px}
.sech>a{font-size:15px;white-space:nowrap}
.sech>a:hover{text-decoration:underline}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tcard h3{font-size:18px;line-height:1.25}
.tcard .csnip{font-size:13px;color:var(--ink-2,#4C5852);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tcard .csnip b{font-weight:600}
.tcard .tgs{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard:hover{transform:translateY(-2px)}
.list .hd{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.25}
.list .txt .q{margin-top:4px;color:var(--muted);font-size:14.5px}
.list .txt .q b{color:var(--ink);font-weight:600}
.battle .side .pct{font-size:30px;letter-spacing:-.02em}
.battle .bq{font-size:20px}
.battle .side.mine{background:var(--brand-soft)}
.side:active:not(:disabled){transform:scale(.98)}
.botd{gap:0;padding:18px}
.botd .bn{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--brand-soft)}
.botd .bn::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.botd .bn.n3{padding-bottom:12px}.botd .bn.n3::before{background:var(--brand)}
.botd .bn .lb{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.botd .bn b{font-family:var(--f-display);font-size:17px;line-height:1.25;display:block}
.botd .bn.n3 b{font-size:19px;color:var(--brand-deep)}
.botd .bn q{display:block;font-style:italic;color:var(--ink);font-size:14.5px;line-height:1.4}
.botd .go{margin-top:10px;color:var(--brand-deep);font-weight:700;font-size:14px}
.botd:hover .go{text-decoration:underline}
@media(max-width:720px){
  .sech h2{font-size:21px}
  .grid.g2{grid-template-columns:1fr}
  .tcard h3{font-size:17px}
  .battle .side .pct{font-size:26px}
}
@media(min-width:1100px){.wrap{max-width:1240px}}
@media(max-width:720px){
  .hero .tlink{display:none}
  .bscroll{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;gap:12px;margin-inline:-16px;padding:0 16px 6px;scrollbar-width:none}
  .bscroll::-webkit-scrollbar{display:none}
  .bscroll>.battle{flex:0 0 86%;scroll-snap-align:start}
}


/* ---- phone-native home (rounds 2-3) ---- */
@media(max-width:720px){
  .sec{margin-bottom:30px}
  .hero{border-bottom:0;margin-bottom:8px}
  .hero .ctas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hero .ctas .btn{min-height:48px;font-size:15px;padding-inline:8px}
  .citychip{min-width:0;padding:9px 16px;flex-direction:row;align-items:baseline;gap:8px;white-space:nowrap}

  .cityrow{gap:8px;padding-bottom:2px}
  .tscroll{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;gap:12px;margin-inline:-16px;padding:0 16px 6px;scrollbar-width:none}

  .list .hd{font-size:16px}

  .bnav{padding-top:4px}

}

.how>summary{list-style:none;cursor:pointer}.how>summary::-webkit-details-marker{display:none}
.morep{display:none}
@media(max-width:720px){
  .preds>div:nth-child(n+2){display:none}
  .morep{display:block;margin-top:12px;text-align:right;color:var(--brand-deep);font-weight:700;font-size:15px}

.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13.5px}
.flow span{padding:7px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.flow span.g{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep)}
.flow i{font-style:normal;color:var(--muted)}

.how>summary::after{content:"";display:inline-block;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:8px;vertical-align:3px}

.citychip.on{border-width:2px;background:var(--brand-soft)}
.citychip.on b::before{content:"✓ ";color:var(--brand)}
.botd .bn{border-left-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.botd .bn.n1::after,.botd .bn.n2::after{content:"↓";position:absolute;left:-8px;bottom:1px;width:14px;text-align:center;color:var(--brand);background:var(--surface);font-size:13px;font-weight:700;line-height:14px}

.local{margin-top:16px;padding:16px;border-radius:16px;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 25%,var(--line))}
.local .sech{margin-bottom:12px}
.local .sech h2{font-size:21px}
.local .tcard{background:var(--surface)}
@media(max-width:720px){.local{margin-inline:-4px;padding:14px}.local .grid.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v2: battles, predictions, analysis, cities, share cards */
.battle{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.battle.inline{margin-top:10px;padding:14px;background:var(--bg)}
.bhead{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bhead .live{color:var(--brand-deep)}
.bhead .live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.bq{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.2}
.sides{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vs{align-self:center;font-family:var(--f-display);font-weight:800;color:var(--muted);font-size:14px}
.side{position:relative;overflow:hidden;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.side:hover:not(:disabled){border-color:var(--brand)}
.side:disabled{cursor:default}
.side .fill{position:absolute;inset:0 auto 0 0;background:var(--brand-soft);z-index:0;transition:width .5s}
.side>*:not(.fill){position:relative;z-index:1}
.side b{font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.side .pct{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.side.mine{border-color:var(--brand)}
.side.win{border-color:var(--star)}
.side .you{font-size:11px;font-weight:700;color:var(--brand-deep);letter-spacing:.04em;text-transform:uppercase}
.bfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.winner{font-weight:700;color:var(--ink)}
.pred .sides{grid-template-columns:1fr 1fr}
.called{padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px}
.called.ok{background:var(--brand-soft);color:var(--brand-deep)}

  for (const r of S.reviews.values()) push(ix.rByTopic,r.topicId,r);
  for (const m of S.gmembers.values()) push(ix.gMem,m.groupId,m);
  for (const d of S.duels.values()){ push(ix.dByTopic,d.topicId,d); if(d.commentId) push(ix.dByComment,d.commentId,d); ix.dv.set(d.id,{c:d.seedC||0,o:d.seedO||0}); }
  for (const v of S.dvotes.values()){ const x=ix.dv.get(v.duelId); if(x) x[v.side==="o"?"o":"c"]++; if(v.userId===S.me) ix.myDV.set(v.duelId,v.side); }
  for (const t of S.topics.values()) if(t.groupId) push(ix.tByGroup,t.groupId,t);
  for (const l of S.likes.values()){ ix.likeN.set(l.targetId,(ix.likeN.get(l.targetId)||0)+1); if(l.userId===S.me) ix.myLikes.add(l.targetId); }
  for (const f of S.follows.values()){ push(ix.fByTopic,f.topicId,f.userId); if(f.userId===S.me) ix.myFollows.add(f.topicId); }
  for (const t of S.topics.values()){ if(t.parentId) push(ix.tKids,t.parentId,t); if(t.originCommentId) push(ix.tByOrigin,t.originCommentId,t); }
  for (const b of S.battles.values()){ push(ix.bByTopic,b.topicId,b); if(b.commentId) push(ix.bByComment,b.commentId,b); ix.bv.set(b.id,{a:b.seedA||0,b:b.seedB||0,recent:0}); }
  const now=Date.now(), decay = t => Math.pow(.5,(now-(t||now))/3.6e6/36);
  for (const v of S.bvotes.values()){ const x=ix.bv.get(v.battleId); if(x){ x[v.side==="b"?"b":"a"]++; x.recent+=decay(v.createdAt); } if(v.userId===S.me) ix.myB.set(v.battleId,v.side); }
  for (const t of S.topics.values()) if(t.kind==="prediction") ix.pv.set(t.id,{yes:t.seedYes||0,no:t.seedNo||0});
  for (const v of S.pvotes.values()){ const x=ix.pv.get(v.topicId); if(x) x[v.side==="no"?"no":"yes"]++; if(v.userId===S.me) ix.myP.set(v.topicId,v.side); push(ix.pVoters,v.topicId,v); }
  IX = ix;
  for (const t of S.topics.values()){
    const rs = ix.rByTopic.get(t.id)||[], cs = ix.cByTopic.get(t.id)||[], kids = ix.tKids.get(t.id)||[], bs=ix.bByTopic.get(t.id)||[];
    const avg = rs.length ? rs.reduce((a,r)=>a+r.rating,0)/rs.length : 0;
    const followers = (ix.fByTopic.get(t.id)||[]).length + (t.seedFollowers||0);
    let score = 3*decay(t.createdAt);
    cs.forEach(c=>score += 2*decay(c.createdAt) + .25*likes(c));
    rs.forEach(r=>score += 3*decay(r.createdAt) + .25*likes(r));
    kids.forEach(k=>score += 4*decay(k.createdAt));
    bs.forEach(b=>{ const x=ix.bv.get(b.id); score += 3*decay(b.createdAt) + (b.endsAt>now?2:0) + 2*x.recent + .01*(x.a+x.b); });
    if(t.kind==="prediction"){ const p=ix.pv.get(t.id); score += .005*(p.yes+p.no); }
    score += .3*followers;
    ix.stats.set(t.id,{ reviews:rs.length, avg, comments:cs.length, branches:kids.length, followers });
    ix.trend.set(t.id, score);
  }
}

/* ---------- debate duels ---------- */
const DH=3.6e6, TURN_MS=24*DH, PENDING_MS=48*DH, VOTE_MS=48*DH, MIN_VOTES=5, MAX_WORDS=150, MIN_WORDS=10;
const ROUND_NAMES=["Opening","Rebuttal","Final word"];
const wordCount = t => (String(t).trim().match(/\S+/g)||[]).length;
function duelState(d){
  const now=Date.now(), r=d.rounds||[];
  if(d.declined) return {phase:"declined"};
  if(!d.acceptedAt) return now>d.createdAt+PENDING_MS ? {phase:"expired"} : {phase:"pending", deadline:d.createdAt+PENDING_MS};
  if(r.length<6){
    const turn=r.length%2===0?"c":"o", last=Math.max(d.acceptedAt, r.length?r[r.length-1].at:0);
    const who=turn==="c"?d.challengerId:d.opponentId;
    if(now>last+TURN_MS) return {phase:"forfeit", winner:turn==="c"?"o":"c", loser:turn};
    return {phase:"active", turn, who, round:Math.floor(r.length/2)+1, deadline:last+TURN_MS};
  }
  const v=IX.dv.get(d.id)||{c:0,o:0}, n=v.c+v.o, pc=n?Math.round(100*v.c/n):50;
  if(now<d.votingEndsAt) return {phase:"voting", v, n, pc, po:100-pc, ends:d.votingEndsAt};
  if(n<MIN_VOTES) return {phase:"done", v, n, pc, po:100-pc, winner:null, noresult:true};
  return {phase:"done", v, n, pc, po:100-pc, winner:v.c>v.o?"c":v.o>v.c?"o":"draw"};
}
const duelPlayer = (d,side) => side==="c"?d.challengerId:d.opponentId;
function duelRecord(uid){
  let w=0,l=0,dr=0;
  for(const d of S.duels.values()){
    const side=d.challengerId===uid?"c":d.opponentId===uid?"o":null; if(!side) continue;
    const st=duelState(d);
    if(st.phase==="forfeit"||(st.phase==="done"&&st.winner)){ if(st.winner==="draw") dr++; else if(st.winner===side) w++; else l++; }
  }
  return {w,l,d:dr,total:w+l+dr};
}
const recordText = r => r.total?`${r.w}W · ${r.l}L${r.d?` · ${r.d}D`:""}`:"No debates yet";
function phaseLabel(d,st){
  if(st.phase==="pending") return `<span class="live">Challenge · waiting for ${esc(nameOf(d.opponentId))}</span>`;
  if(st.phase==="active") return `<span class="live">Round ${st.round} of 3 · ${esc(nameOf(st.who))}’s turn</span>`;
  if(st.phase==="voting") return `<span class="live">Voting open · ends in ${left(st.ends-Date.now())}</span>`;
  if(st.phase==="forfeit") return `<span>Ended · ${esc(nameOf(duelPlayer(d,st.winner)))} won by forfeit</span>`;
  if(st.phase==="done") return `<span>Ended · ${st.noresult?"no result":st.winner==="draw"?"draw":esc(nameOf(duelPlayer(d,st.winner)))+" won"}</span>`;
  return `<span>${st.phase==="declined"?"Declined":"Challenge expired"}</span>`;
}
function duelMini(d){

  return `<a class="duelmini" href="#d-${esc(d.id)}"><div class="bhead">${phaseLabel(d,st)}</div>

  const seen=new Set(skip||[]), out=[];
  for(const c of [...S.comments.values()].filter(cLive).sort((a,b)=>b.createdAt-a.createdAt)){

}

function vDuel(id){
  const d=S.duels.get(id);
  if(!d){ const raw=R.duels.get(id); if(raw&&!S.topics.has(raw.topicId)) return emptyBox(`${LOCK} Private group debate`,"Only members of the group can see this debate.");
    return S.ready.duels?emptyBox("Debate not found","It may have been removed.",`<a class="btn" href="#home">Go home</a>`):`<p class="muted">Loading…</p>`; }
  const st=duelState(d), t=S.topics.get(d.topicId), r=d.rounds||[];
  const meSide=S.me===d.challengerId?"c":S.me===d.opponentId?"o":null;
  const myVote=IX.myDV.get(id);
  const player=(side)=>{ const uid=duelPlayer(d,side), rec=duelRecord(uid), win=(st.winner===side);
    return `<div class="dplayer ${win?"win":""}">${avatar(uid)}<div style="min-width:0"><div><a href="#u-${esc(uid)}" style="font-weight:700">${esc(nameOf(uid))}</a>${win?" 🏆":""}</div><div class="meta"><span class="${side==="o"?"for":"against"}">${side==="o"?"For":"Against"} the motion</span><span>${recordText(rec)}</span></div></div></div>`; };
  const bubble=(i)=>{ const x=r[i], side=i%2===0?"c":"o";
    if(x) return `<div class="dturn ${side}"><div class="meta"><b style="color:var(--ink)">${esc(nameOf(duelPlayer(d,side)))}</b><span class="${side==="o"?"for":"against"}">${side==="o"?"For":"Against"}</span><span>${wordCount(x.text)} words</span><span>${ago(x.at)}</span></div><div class="ctext">${esc(x.text)}</div></div>`;
    const waiting=st.phase==="active"&&r.length===i;
    return `<div class="dturn ${side} empty">${waiting?`Waiting for ${esc(nameOf(duelPlayer(d,side)))}… (${left(st.deadline-Date.now())} left)`:"Not written yet"}</div>`; };
  // challenger (AGAINST) speaks first each round, so they sit on the left
  const rounds=[0,1,2].map(k=>`<div class="dround"><div class="dlabel">Round ${k+1} · ${ROUND_NAMES[k]}</div><div class="dpair">${bubble(2*k)}${bubble(2*k+1)}</div></div>`).join("");
  let action="";
  if(st.phase==="pending"){
    if(meSide==="o") action=`<div class="dbox"><b>${esc(nameOf(d.challengerId))} challenged you.</b> Argue <b>for</b> the motion in 3 rounds of up to ${MAX_WORDS} words. You have ${left(st.deadline-Date.now())} to accept.<div style="display:flex;gap:8px;margin-top:10px"><button class="btn pri sm" data-act="duelAccept" data-id="${esc(id)}">Accept the duel</button><button class="btn sm" data-act="duelDecline" data-id="${esc(id)}">Decline</button></div></div>`;
    else action=`<div class="dbox muted">Waiting for ${esc(nameOf(d.opponentId))} to accept. The challenge expires in ${left(st.deadline-Date.now())}.</div>`;
  } else if(st.phase==="active"){
    if(meSide===st.turn) action=`<div class="dbox"><b>Your turn: Round ${st.round}, ${ROUND_NAMES[st.round-1]}.</b> <span class="muted">You have ${left(st.deadline-Date.now())}. If you don’t reply in time, you lose by forfeit.</span>
      <textarea id="duel-text" rows="5" data-wc="duel-wc" placeholder="${st.round===1?"Make your case.":st.round===2?"Answer their points directly.":"Sum up why your side is stronger."}" style="margin-top:10px"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px"><span class="hint" id="duel-wc">0 / ${MAX_WORDS} words</span><button class="btn pri sm" data-act="duelPost" data-id="${esc(id)}">Post round ${st.round}</button></div></div>`;
    else if(meSide) action=`<div class="dbox muted">Waiting for ${esc(nameOf(st.who))} to reply.</div>`;
  } else if(st.phase==="voting"){
    if(meSide) action=`<div class="dbox"><b>Voting is open.</b> You can’t vote in your own duel. ${st.n} vote${st.n===1?"":"s"} so far; at least ${MIN_VOTES} are needed for a result.</div>`;
    else if(!myVote&&!UI.dReady[id]) action=`<div class="dbox"><b>Who argued better?</b> Judge the arguments, not which side you agree with. Read all three rounds first.<div style="margin-top:10px"><button class="btn pri sm" data-act="duelReady" data-id="${esc(id)}">I’ve read both sides</button></div></div>`;
    else action=`<div class="dbox"><b>Who argued better?</b><div class="sides" style="margin-top:10px">${["c","o"].map((k,i)=>`${i?`<span class="vs">VS</span>`:""}<button class="side ${myVote===k?"mine":""}" data-act="duelVote" data-id="${esc(id)}" data-v="${k}">${myVote?`<span class="fill" style="width:${k==="c"?st.pc:st.po}%"></span>`:""}<b>${esc(nameOf(duelPlayer(d,k)))}</b>${myVote?`<span class="pct">${k==="c"?st.pc:st.po}%</span>`:`<span class="muted" style="font-size:12.5px">${k==="o"?"For":"Against"}</span>`}${myVote===k?`<span class="you">Your vote</span>`:""}</button>`).join("")}</div><div class="hint" style="margin-top:6px">${st.n} ${st.n===1?"vote":"votes"} · ends in ${left(st.ends-Date.now())} · you can change your vote until then</div></div>`;
  } else if(st.phase==="done"||st.phase==="forfeit"){
    const msg = st.phase==="forfeit" ? `🏆 ${esc(nameOf(duelPlayer(d,st.winner)))} wins by forfeit. ${esc(nameOf(duelPlayer(d,st.loser)))} didn’t reply within 24 hours.`
      : st.noresult ? `No result. Only ${st.n} vote${st.n===1?"":"s"}; a debate needs at least ${MIN_VOTES}.`
      : st.winner==="draw" ? `It’s a draw, ${st.pc}% to ${st.po}% from ${st.n} ${st.n===1?"vote":"votes"}.`
      : `🏆 ${esc(nameOf(duelPlayer(d,st.winner)))} argued better, winning ${Math.max(st.pc,st.po)}% to ${Math.min(st.pc,st.po)}% from ${st.n} ${st.n===1?"vote":"votes"}.`;
    action=`<div class="dbox result">${msg}</div>`;
  } else action=`<div class="dbox muted">${st.phase==="declined"?`${esc(nameOf(d.opponentId))} declined this duel.`:"This challenge expired before it was accepted."}</div>`;
  const oc=d.commentId&&S.comments.get(d.commentId);
  return `<div class="meta" style="font-size:13px"><span>Debate duel</span>${t?`<a href="#t-${t.id}${oc?"~"+oc.id:""}" style="color:var(--brand-deep);font-weight:600">in ${esc(t.title)}</a>`:""}</div>

   <div class="dplayers">${player("c")}<span class="vs">VS</span>${player("o")}</div>
   ${action}
   <div class="drounds">${rounds}</div>
   <p class="muted" style="font-size:13px;margin-top:18px">Win the debate, not the argument. Voters judge who argued better, not who they agree with. Argue the point, never the person.</p>`;
}

const STOP=new Set("a an the is are was were be to of in on for and or vs versus which what who whom how why where when best most good better any around nearby happening things place places there top find show me do does did should can could would will i my me we our it its this that these with at by from about than near under over into get got".split(" "));
const qWords = q => String(q).toLowerCase().split(/[^\p{L}\p{M}\p{N}₹]+/u).filter(w=>w&&w.length>1&&!STOP.has(w));
function parseQ(q){
  q=q.trim().toLowerCase(); let near=/\b(near me|nearby|around me|close to me|in my area|my area)\b/.test(q); let rest=q.replace(/\b(near me|nearby|around me|close to me|in my area|my area)\b/g," ");
  const toks=rest.split(/[^\p{L}\p{M}\p{N}₹.]+/u).filter(Boolean); let place=null, used=new Set();
  for(let n=3;n>=1&&!place;n--) for(let i=0;i+n<=toks.length&&!place;i++){ const ph=toks.slice(i,i+n).join(" "); const pl=placeOf(ph); if(pl&&!STOP.has(ph)){ place=pl; for(let j=i;j<i+n;j++) used.add(j); } }
  // "anna nagar biryani" also tries area before a following city word handled by placeOf; keep first hit
  if(!place&&near){ place=homeArea()||homePlace(); }
  const words=toks.filter((w,i)=>!used.has(i)&&w.length>1&&!STOP.has(w));
  return {place,words,near,homeFallback:!place&&!!homePlace()};
}
function suggestQ(v){
  const pq=parseQ(v), out=[]; const add=x=>{ if(x&&x.toLowerCase()!==v&&!out.includes(x)&&out.length<4) out.push(x); };
  if(pq.place&&pq.words.length<=1){ const tc=new Map(); LIVE().filter(t=>inPlace(t,pq.place)).forEach(t=>(t.tags||[]).forEach(g=>tc.set(g,(tc.get(g)||0)+1))); const pre=pq.words[0]||""; [...tc].filter(([g])=>g!==pq.place.name.toLowerCase().replace(/\s/g,"")&&g.startsWith(pre)).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([g])=>add(pq.place.name+" "+g)); }
  else if(!pq.place&&pq.words.length&&v.length>=3){ const w=pq.words[pq.words.length-1], pc=new Map(); LIVE().forEach(t=>{ const pl=placeOf(t.location); if(!pl) return; const hay=((t.tags||[]).join(" ")+" "+t.title+" "+t.category).toLowerCase(); if(hay.includes(w)){ const c=pl.type==="area"?PLACES.byId.get(pl.city):pl; pc.set(c.name,(pc.get(c.name)||0)+1); } }); const hp=homePlace(); if(hp&&pc.has(hp.name)) add(pq.words.join(" ")+" in "+hp.name); [...pc].sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([n])=>add(pq.words.join(" ")+" in "+n)); }
  return out;
}
function topicScore(t, q, words){
  const title=t.title.toLowerCase(); let s=0;
  if(title.includes(q)) s+=6;
  const meta=((t.tags||[]).join(" ")+" "+t.category+" "+(t.location||"")+" "+(t.desc||"")).toLowerCase();
  const talk=(IX.cByTopic.get(t.id)||[]).map(c=>c.text).join(" ").toLowerCase()+" "+(IX.rByTopic.get(t.id)||[]).map(r=>(r.title||"")+" "+(r.text||"")+" "+(r.pros||"")+" "+(r.cons||"")).join(" ").toLowerCase();
  let hit=0;
  for(const w of words){ let h=false; if(title.includes(w)){ s+=3; h=true; } if(meta.includes(w)){ s+=1; h=true; } if(talk.includes(w)){ s+=.6; h=true; } if(h) hit++; }
  if(words.length) s*= (0.4+0.6*hit/words.length);
  return s;
}
function searchAll(q,n){
  q=q.trim().toLowerCase(); const pq=parseQ(q); const words=pq.place?pq.words:qWords(q), place=pq.place, hp=homePlace();
  const tagset=new Set(); for(const t of LIVE())(t.tags||[]).forEach(x=>tagset.add(x));
  const qtext=place?words.join(" "):q;
  const score=t=>{ let sc=words.length?topicScore(t,qtext,words):0; const inP=place?inPlace(t,place):false;
    if(place){ if(!words.length) return inP?2+IX.trend.get(t.id)*.01:0; if(inP) sc=sc>=1?sc+5:sc>0?sc+3:2.2; else if(sc>=1.5) sc=sc*.6; else sc=0; }
    else if(hp&&sc>=1.5&&inPlace(t,hp)) sc+=2.5;
    return sc; };
  const scored=LIVE().map(t=>[t,score(t)]).filter(x=>x[1]>=(place&&!words.length?1:1.5)).sort((a,b)=>b[1]-a[1]||IX.trend.get(b[0].id)-IX.trend.get(a[0].id));
  const topics=scored.slice(0,n).map(x=>x[0]);
  const qq=q.replace(/^#/,"");
  const tags=[...tagset].filter(x=>x.includes(qq)||words.includes(x)||(place&&x===place.name.toLowerCase().replace(/\s/g,""))).slice(0,10);
  const people=place?[]:[...S.handles].filter(([id,d])=>(d.handle||"").toLowerCase().includes(qq.replace(/^@/,""))||idHit(id,qq)).map(([id])=>id).slice(0,8);
  let cs=cities().filter(c=>c.name.toLowerCase().includes(qq)||words.includes(c.slug)).slice(0,6);
  if(place){ const pid=place.id; cs=[{slug:pid,name:place.label,n:0},...cs.filter(c=>c.slug!==pid&&c.slug!==place.city)]; }
  const live=new Set(LIVE().map(t=>t.id)), ids=new Set(topics.map(t=>t.id));
  const battles=[...S.battles.values()].filter(b=>b.endsAt>Date.now()&&live.has(b.topicId)&&(ids.has(b.topicId)||(words.length&&words.every(w=>(b.question||"").toLowerCase().includes(w))))&&(!place||inPlace(S.topics.get(b.topicId),place))).slice(0,3);
  return {topics,tags,people,cities:cs,battles,place,words,near:pq.near,homeFallback:pq.homeFallback};
}

function verdictPanel(t, rs){
  const s=stat(t.id);
  if(!rs.length) return `<div class="panel"><h3>${L("Community verdict")}</h3><p class="muted" style="margin:0 0 10px;font-size:14px">No reviews yet. The verdict appears after the first one.</p><button class="btn sm" data-act="openReview">${L("Write a review")}</button></div>`;
  const dist=[5,4,3,2,1].map(n=>[n,rs.filter(r=>r.rating===n).length]);
  const rec=Math.round(100*rs.filter(r=>r.rating>=4).length/rs.length);
  const tally=(list,f)=>{ const m=new Map(); list.forEach(r=>String(r[f]||"").split(/[,;\n]+/).map(x=>x.trim().toLowerCase()).filter(x=>x&&x.length<40).forEach(x=>m.set(x,(m.get(x)||0)+1))); return m; };
  const top=m=>[...m].sort((a,b)=>b[1]-a[1]).slice(0,3);
  const P=top(tally(rs,"pros")), C=top(tally(rs,"cons"));
  // verdict over time
  const chron=[...rs].sort((a,b)=>a.createdAt-b.createdAt);
  let trendHTML="";
  if(chron.length>=2){
    let sum=0; const pts=chron.map((r,i)=>{ sum+=r.rating; return sum/(i+1); });
    const W=280,H=56,pad=6, x=i=>pad+(W-2*pad)*(pts.length===1?0:i/(pts.length-1)), y=v=>pad+(H-2*pad)*(5-v)/4;
    const path=pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    const area=path+`L${x(pts.length-1).toFixed(1)},${H-pad}L${x(0).toFixed(1)},${H-pad}Z`;
    const first=chron[0].rating, now=pts[pts.length-1], diff=now-first;
    const half=Math.floor(chron.length/2), early=tally(chron.slice(0,half),"cons"), late=tally(chron.slice(half),"cons");
    const rising=[...late].map(([k,v])=>[k,v-(early.get(k)||0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])[0];
    const msg=Math.abs(diff)<.3?"Steady since the first reviews":diff<0?`Down ${Math.abs(diff).toFixed(1)} since the first reviews`:`Up ${diff.toFixed(1)} since the first reviews`;
    trendHTML=`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Average rating over time"><line x1="${pad}" x2="${W-pad}" y1="${y(3)}" y2="${y(3)}" stroke="var(--line)" stroke-dasharray="3 4"/><path d="${area}" fill="var(--brand-soft)"/><path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2.2" vector-effect="non-scaling-stroke"/><circle cx="${x(pts.length-1)}" cy="${y(now)}" r="3.5" fill="var(--brand)"/></svg>
      <div class="trend"><span>${fmtDate(chron[0].createdAt)} · ${first.toFixed(1)}</span><span>Now · ${now.toFixed(1)}</span></div>
      <div style="font-size:13px;margin-top:6px"><b>${msg}.</b>${rising?` Rising complaint: <span style="color:var(--danger)">${esc(rising[0])}</span>.`:""}</div>`;
  }
  // strongest other side
  let other="";
  if(rs.length>=3){
    const positive=s.avg>=3.5;
    const cand=rs.filter(r=>positive?r.rating<=3:r.rating>=4).sort((a,b)=>likes(b)-likes(a))[0];
    if(cand) other=`<div class="otherside"><span class="otherchip">Strongest other side</span> <span class="stars">${stars(cand.rating)}</span> · ${who(cand.authorId)}<q>${esc((cand.title?cand.title+". ":"")+(cand.text||"").slice(0,140))}</q></div>`;
  }
  return `<div class="panel"><h3>${L("Community verdict")}</h3>
      <div class="verdict"><div class="big">${s.avg.toFixed(1)}</div><div><div class="stars">${stars(s.avg)}</div><div class="muted" style="font-size:13px">${rs.length} review${rs.length>1?"s":""} · <b style="color:var(--ink)">${rec}% recommend</b></div></div></div>
      <div class="bars">${dist.map(([n,c])=>`<div><span>${n}★</span><span class="b"><i style="width:${100*c/rs.length}%"></i></span><span>${Math.round(100*c/rs.length)}%</span></div>`).join("")}</div>
      ${P.length||C.length?`<div class="pc">${P.map(([x])=>`<span class="chip p">✓ ${esc(x)}</span>`).join("")}${C.map(([x])=>`<span class="chip c">✕ ${esc(x)}</span>`).join("")}</div>`:""}
      ${trendHTML}${other}
      <div style="margin-top:12px"><button class="btn sm" data-act="shareTopic" data-id="${t.id}">${ICON.share} ${L("Share card")}</button></div>
    </div>`;
}

function aiPanel(t, n){
  const a=UI.ai[t.id], busy=UI.aiBusy[t.id];
  if(!sampleFn || n<3) return "";
  if(busy) return `<div class="ai"><h4>${L("Catch me up")}</h4><div class="muted">Reading ${n} comments… this can take up to a minute.</div></div>`;
  if(!a) return "";
  if(a.error) return `<div class="ai"><h4>${L("Catch me up")}</h4><div class="muted">${esc(a.error)}</div></div>`;
  return `<div class="ai"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h4>${L("Catch me up")} · ${n} comments</h4><button class="act" data-act="aiClose" data-id="${t.id}">Hide</button></div>
    ${a.tldr?`<div style="font-size:15px">${esc(a.tldr)}</div>`:""}
    ${(a.agree||[]).length?`<div><h4 style="margin-bottom:4px">Most people agree</h4><ul>${a.agree.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    ${(a.debates||[]).map(d=>`<div><h4 style="margin-bottom:2px">Still arguing: ${esc(d.issue||"")}</h4><div class="deb"><div>${esc(d.side_a||"")}</div><div>${esc(d.side_b||"")}</div></div></div>`).join("")}
    <div class="muted" style="font-size:12px">Summary written by Claude from the comments on this page. It can miss nuance.</div></div>`;
}

  const s=stat(id), rs=(IX.rByTopic.get(id)||[]).sort((a,b)=>likes(b)-likes(a)||b.createdAt-a.createdAt);

  const parent=t.parentId&&S.topics.get(t.parentId), oc=t.originCommentId&&S.comments.get(t.originCommentId);

    ${(()=>{ if(!t.groupId) return ""; const g=S.groups.get(t.groupId); if(!g) return ""; const priv=g.visibility==="private";

}
const isAnc=(c,id)=>c.id===id||(IX.cKids.get(c.id)||[]).some(x=>isAnc(x,id));
function commentNode(c,t,depth,otherIds){
  const kids=(IX.cKids.get(c.id)||[]).sort((a,b)=>a.createdAt-b.createdAt);
  const outs=IX.tByOrigin.get(c.id)||[], bts=IX.bByComment.get(c.id)||[];
  const n=likes(c), on=IX.myLikes.has(c.id), del=!!c.deletedAt;
  const fresh = TY.seenReady && !TY.seen.has(c.id); TY.pending.add(c.id);
  const tgt=(location.hash.split("~")[1]||"");
  const open=UI.more.has(c.id)||(tgt&&kids.slice(2).some(k=>isAnc(k,tgt)));
  const shown=open?kids:kids.slice(0,2), hidden=kids.length-shown.length;
  const par=depth>=2&&c.parentId&&S.comments.get(c.parentId);
  return `<div class="cmt${fresh?" rise":""}" id="c-${c.id}">${avatar(c.authorId,depth?"xs":"")}<div class="main">
    <div class="head">${who(c.authorId)}${c.authorId===t.authorId?'<span class="op">OP</span>':""}${otherIds&&otherIds.has(c.id)?'<span class="otherchip">Other side</span>':""}<span class="muted">· ${ago(c.createdAt)}${c.editedAt&&!del?" · edited":""}</span>${outs.length?`<span class="op" title="Topics started from this comment">Sparked ${outs.length} topic${outs.length>1?"s":""}</span>`:""}</div>
    ${par?`<div class="replyto">↪ replying to @${esc(nameOf(par.authorId))}</div>`:""}
    ${del?`<div class="ctext muted" style="font-style:italic">Comment deleted</div>`:(c.text?`<div class="ctext${isEmojiOnly(c.text)?" big":""}">${rich(c.text)}</div>`:"")}
    ${del?"":mediaHTML(c)}
    ${outs.map(b=>`<a class="bout" href="#t-${b.id}">${ICON.branch.replace("<svg",'<svg width="14" height="14"')}Became a topic: ${esc(b.title)} ↗</a>`).join(" ")}
    ${bts.map(b=>battleCard(b,{inline:true})).join("")}
    ${(IX.dByComment.get(c.id)||[]).filter(d=>{ const p=duelState(d).phase; return p!=="declined"&&p!=="expired"; }).map(duelMini).join("")}
    <div class="actions">
      ${del?"":`<button class="act ${on?"on":""}" data-act="like" data-id="${c.id}" data-kind="comment" aria-pressed="${on}">${ICON.up}${n}</button>`}
      ${t.deletedAt?"":`<button class="act" data-act="reply" data-id="${c.id}">${ICON.reply}${L("Reply")}</button>`}
      ${del?"":`<button class="act more" data-act="cmore" data-id="${c.id}" aria-label="More actions" title="More">⋯</button>`}
    </div>
    ${UI.replyOpen.has(c.id)?`<div class="composer" style="margin:6px 0 4px"><div class="box"><textarea id="r-${c.id}" rows="2" placeholder="Reply to ${esc(nameOf(c.authorId))}…"></textarea><div style="display:flex;gap:6px"><button class="btn sm" data-act="reply" data-id="${c.id}">Cancel</button><button class="btn pri sm" data-act="postReply" data-id="${c.id}">${L("Reply")}</button></div></div></div>`:""}
    ${kids.length?`<div class="kids">${shown.map(k=>commentNode(k,t,depth+1,otherIds)).join("")}${hidden>0?`<button class="act" data-act="moreReplies" data-id="${c.id}" style="margin:6px 0 0 -8px">View ${hidden} more repl${hidden>1?"ies":"y"}</button>`:""}</div>`:""}
  </div></div>`;
}

    ${r.title?`<h4>${esc(r.title)}</h4>`:""}

}

function groupNotifs(ns){
  const G=/^(reply|comment|mention|like|review)$/, out=[];
  for(const n of ns){
    const g=G.test(n.type)&&out.find(o=>o.type===n.type&&o.from===n.from&&o.topicId===n.topicId&&o.createdAt-n.createdAt<864e5&&!o.dead);
    if(g){ g.count++; g.ids.push(n.id); } else out.push({...n,count:1,ids:[n.id]});
  }
  return out;
}
function vAlerts(){
  if(!S.me) return emptyBox("Sign in to see notifications","Open this page in claude.ai while signed in.");
  const ns=notifList().sort((a,b)=>b.createdAt-a.createdAt);
  const label={reply:"replied to you",mention:"mentioned you",tagged:"tagged you in a topic",comment:"commented on a topic you follow",branch:"branched your comment into a new topic",newbranch:"started a branch from a topic you follow",review:"reviewed a topic you follow",like:"liked your post",battle:"started a battle about your comment",newbattle:"started a battle in a topic you follow",resolved:"resolved a prediction you voted on",grouppost:"posted in your group",joined:"joined your group",duel_challenge:"challenged you to a debate duel",duel_accept:"accepted your debate challenge",duel_decline:"declined your debate challenge",duel_turn:"replied in your debate. Your turn",duel_vote:"finished a debate. Voting is open",friend_req:"sent you a friend request",friend_ok:"accepted your friend request",follow:"started following you",invited:"invited you to a discussion",joinreq:"asked to join your topic",joinok:"let you into a topic",added:"added you to a private topic",madeprivate:"made a topic private",friend_no:"declined your friend request"};

async function loadBanner(file){
  if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error("Pick a PNG, JPG, WebP or GIF picture.");
  const [w,h,img]=await imgSize(await readAsDataURL(file)); if(!img) throw new Error("That file couldn’t be opened.");
  return {img,w,h,px:.5,py:.5,z:1};
}
function bnRect(st,W2,H2){ const k=Math.max(W2/st.w,H2/st.h)*st.z, sw=W2/k, sh=H2/k; return [(st.w-sw)*st.px,(st.h-sh)*st.py,sw,sh]; }
function bnDraw(st,c){ const x=c.getContext("2d"); const [sx,sy,sw,sh]=bnRect(st,c.width,c.height); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(st.img,sx,sy,sw,sh,0,0,c.width,c.height); }
function bnEncode(st){
  for(const [W2,H2,qs] of [[960,320,[.8,.7,.6,.5]],[720,240,[.7,.55,.45]],[540,180,[.6,.45]]]){
    const c=document.createElement("canvas"); c.width=W2; c.height=H2; bnDraw(st,c);
    for(const q of qs){ const out=c.toDataURL("image/jpeg",q); if(out.length<=48000) return out; }
  }
  throw new Error("That picture is too detailed to shrink enough. Try another one.");
}
function bnAdjust(box,st,err){
  box.innerHTML=`<div class="banner adj" id="bn-frame" style="touch-action:none;cursor:grab"><canvas width="480" height="160" style="width:100%;height:100%;display:block"></canvas></div>
  <div class="dprow" style="margin-top:6px"><span class="muted" style="font-size:12px">Zoom</span><input type="range" id="bn-zoom" min="1" max="4" step="0.01" value="${st.z}" style="flex:1"></div>
  <div class="muted" style="font-size:12px">Drag the picture to move it. Use Zoom to fit what you want in the banner.</div>`;
  const fr=box.querySelector("#bn-frame"), cv=fr.querySelector("canvas"), zm=box.querySelector("#bn-zoom");
  const redraw=()=>bnDraw(st,cv), commit=()=>{ try{ UI.bn=bnEncode(st); if(err) err.textContent=""; }catch(ex){ if(err) err.textContent=ex.message; } };
  redraw(); commit();
  let drag=null;
  fr.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY,px:st.px,py:st.py}; fr.setPointerCapture(e.pointerId); fr.style.cursor="grabbing"; });
  fr.addEventListener("pointermove",e=>{ if(!drag) return; const r=fr.getBoundingClientRect(), [,,sw,sh]=bnRect(st,480,160);
    const dxs=(e.clientX-drag.x)/r.width*sw, dys=(e.clientY-drag.y)/r.height*sh, mx=st.w-sw, my=st.h-sh;
    st.px=mx>0?Math.min(1,Math.max(0,drag.px-dxs/mx)):.5; st.py=my>0?Math.min(1,Math.max(0,drag.py-dys/my)):.5; redraw(); });
  const end=()=>{ if(!drag) return; drag=null; fr.style.cursor="grab"; commit(); };
  fr.addEventListener("pointerup",end); fr.addEventListener("pointercancel",end);
  zm.addEventListener("input",()=>{ st.z=+zm.value; redraw(); }); zm.addEventListener("change",commit);
  box._st=st;
}

const MEDIA_MAX = 190*1024;
const ATT = {};   // textarea id -> {data, w, h, type, size}
function readAsDataURL(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
function imgSize(src){ return new Promise(res=>{ const i=new Image(); i.onload=()=>res([i.naturalWidth,i.naturalHeight,i]); i.onerror=()=>res([0,0,null]); i.src=src; }); }
async function prepMedia(file){
  const animated = /gif|webp/.test(file.type);
  if(!/^image\/(gif|webp|png|jpeg)$/.test(file.type)) throw new Error("Pick a GIF, PNG, JPG or WebP file.");
  let data=await readAsDataURL(file); let [w,h,img]=await imgSize(data);
  if(!img) throw new Error("That file couldn’t be opened.");
  if(file.size<=MEDIA_MAX) return {data,w,h,type:file.type==="image/gif"?"gif":"image",size:file.size};
  if(animated && file.type==="image/gif") throw new Error(`This GIF is ${Math.round(file.size/1024)} KB. In this prototype GIFs must be under 190 KB. Try a smaller one, or a sticker-size GIF.`);
  // photos (and big WebP stills): shrink to fit
  for(const max of [1280,1024,800,640]){
    const k=Math.min(1,max/Math.max(w,h)), c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    for(const qv of [0.82,0.7,0.6]){ const out=c.toDataURL("image/jpeg",qv); const bytes=Math.round((out.length-23)*3/4); if(bytes<=MEDIA_MAX) return {data:out,w:c.width,h:c.height,type:"image",size:bytes}; }
  }
  throw new Error("That image is too large even after shrinking it.");
}

}

function mediaHTML(c){

/* ---------- writes ---------- */
async function W(fn){
  try{ await fn(); return true; }
  catch(e){
    if(e&&e.code==="invalid_argument"){ S.readOnly=true; renderBanner(); toast("You can’t post here yet. Ask the owner for Contributor access."); }
    else if(e&&e.code==="quota_exceeded") toast("Storage is full. The owner needs to remove old content.");
    else if(e&&e.code==="resource_exhausted") toast("Slow down a little, then try again.");
    else toast("Couldn’t save. Check your connection and try again.");
    return false;
  }
}
async function gate(){
  if(!db||!S.me){ toast("Open this page in claude.ai while signed in to post."); return false; }
  if(S.readOnly){ toast("You can read here, but not post. Ask the owner for Contributor access."); return false; }
  if(!handleOf(S.me)) return await askHandle();
  return true;
}
function rateOk(text){
  const now=Date.now();

  if(text){ const dup=[...S.comments.values()].some(c=>c.authorId===S.me&&c.text.trim()===text.trim()&&now-c.createdAt<600000); if(dup){ toast("You just posted that."); return false; } }
  UI.lastPost=now; return true;
}

    try{ await db.collection("notifs").add({...base,to,type,from:S.me,createdAt:Date.now(),read:false}); }catch{}
  }
}

async function postComment(topicId, parentId, text, taId){
  text=text.trim(); const att=taId&&ATT[taId];
  if(!text&&!att) { toast("Write something first."); return false; }
  if(text.length>3000){ toast("Keep it under 3,000 characters."); return false; }

/* ---------- Catch me up / other side (Claude) ---------- */
async function analyze(tid){
  if(!sampleFn||UI.aiBusy[tid]) return;
  const t=S.topics.get(tid); const cs=(IX.cByTopic.get(tid)||[]).sort((a,b)=>likes(b)-likes(a)).slice(0,120);
  const rs=(IX.rByTopic.get(tid)||[]).slice(0,30);
  const prompt=`You summarize a discussion thread from TopicTalk, an Indian social discussion site. Comments may be in English, Tamil or Tanglish. Write your answer in simple, plain English.

Topic: ${t.title}
Description: ${(t.desc||"").slice(0,500)}
${rs.length?`Reviews (rating out of 5):\n${rs.map(r=>`- ${r.rating}/5: ${(r.title||"")} ${(r.text||"").slice(0,200)} Pros: ${r.pros||"-"} Cons: ${r.cons||"-"}`).join("\n")}\n`:""}
Comments (id | likes | text):
${cs.map(c=>`${c.id} | ${likes(c)} | ${c.text.replace(/\s+/g," ").slice(0,300)}`).join("\n")}

Reply with only a JSON object in this shape:
{"tldr":"one or two sentences on where the conversation stands","agree":["up to 3 short points most people agree on"],"debates":[{"issue":"what people disagree about","side_a":"the strongest point for one side","side_b":"the strongest point for the other side"}],"other_side_ids":["ids of comments that push back on the most popular view, strongest first"]}
Use at most 3 debates and at most 6 ids. Only use ids from the list above.`;
  UI.aiBusy[tid]=true; schedule();
  try{
    const a=await sampleFn.json(prompt,{modelTier:"quick"});
    UI.ai[tid]={ tldr:String(a?.tldr||""), agree:Array.isArray(a?.agree)?a.agree.map(String).slice(0,3):[], debates:Array.isArray(a?.debates)?a.debates.slice(0,3):[], other_side_ids:Array.isArray(a?.other_side_ids)?a.other_side_ids.map(String):[] };
  }catch(e){
    const msg={not_granted:"Claude wasn’t allowed for this page, so summaries are off.",sampling_disabled:"Claude isn’t available on this account.",rate_limited:"Too many requests right now. Try again in a minute.",invalid_json:"The summary came back garbled. Try again.",refused:"Claude couldn’t summarize this thread.",cancelled:null}[e?.code];
    if(e?.code==="not_granted"||e?.code==="sampling_disabled") sampleFn=null;
    UI.ai[tid]= msg===null ? undefined : {error: msg||"Couldn’t summarize right now. Try again."};
  }
  UI.aiBusy[tid]=false; schedule();
}

/* ---------- community answers ---------- */
function topicDigest(t, maxC){
  const st=stat(t.id), rs=IX.rByTopic.get(t.id)||[];
  const lines=[`TOPIC ${t.id}: ${t.title} (${t.category}${t.location?", "+t.location:""})`];
  if(t.desc) lines.push(`Description: ${t.desc.slice(0,300)}`);
  if(rs.length){ const rec=Math.round(100*rs.filter(r=>r.rating>=4).length/rs.length); lines.push(`Reviews: ${st.avg.toFixed(1)}/5 from ${rs.length} reviews, ${rec}% recommend.`); rs.slice(0,8).forEach(r=>lines.push(`- review ${r.rating}/5: ${(r.title||"")} ${(r.text||"").slice(0,160)} Pros: ${r.pros||"-"} Cons: ${r.cons||"-"}`)); }
  for(const b of IX.bByTopic.get(t.id)||[]){ const s=battleState(b); lines.push(`Battle "${b.question}": ${b.a} ${s.pa}% vs ${b.b} ${s.pb}% (${s.n} ${s.n===1?"vote":"votes"}, ${s.ended?(s.winner==="tie"?"ended in a tie":"ended, winner "+(s.winner==="a"?b.a:b.b)):"still open"})`); }
  if(t.kind==="prediction"){ const p=IX.pv.get(t.id), n=p.yes+p.no; lines.push(`Prediction: ${n?Math.round(100*p.yes/n):0}% say yes (${n} ${n===1?"vote":"votes"})${t.outcome?", resolved "+t.outcome.toUpperCase():", unresolved"}.`); }
  if(t.answer?.text) lines.push(`Previously written community answer: ${t.answer.text}`);
  const cs=(IX.cByTopic.get(t.id)||[]).sort((a,b)=>likes(b)-likes(a)).slice(0,maxC);
  if(cs.length){ lines.push("Comments (id | likes | text):"); cs.forEach(c=>lines.push(`${c.id} | ${likes(c)} | ${c.text.replace(/\s+/g," ").slice(0,280)}`)); }
  return lines.join("\n");
}
function answerPrompt(question, topics){
  return `Someone asked TopicTalk, an Indian community discussion site: "${question}"

Answer using ONLY the community content below. Comments may be in English, Tamil or Tanglish. Write in simple, plain English. Be direct: lead with the answer, then why. Mention vote percentages or ratings when they help. If people disagree, say so briefly. If the content does not actually answer the question, set "answered" to false.

${topics.map(t=>topicDigest(t, topics.length>2?15:30)).join("\n\n")}

Reply with only a JSON object:

function wrap(x, text, maxW, maxLines){
  const words=String(text).split(/\s+/), lines=[]; let line="";

  if(line) lines.push(line);
  if(lines.length>maxLines){ lines.length=maxLines; lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,"")+"…"; }
  return lines;
}

  ${unrated.length?`<section class="sec"><div class="sech"><h2>Waiting for a first review</h2></div><div class="list">${unrated.slice(0,8).map(t=>`<a href="#t-${t.id}" data-act="pickReview" data-id="${t.id}"><div class="txt"><b>${esc(t.title)}</b><div class="meta"><span>${esc(t.category)}</span>${t.location?`<span>📍 ${esc(t.location)}</span>`:""}<span>No reviews yet</span></div></div></a>`).join("")}</div></section>`:""}`;

document.addEventListener("click", async e=>{

      break; }
