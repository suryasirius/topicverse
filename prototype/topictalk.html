      const ok=busy?await W(()=>db.doc("comments/"+id).update({text:"",deletedAt:Date.now(),media:[],mediaType:""})):await W(()=>db.doc("comments/"+id).delete());
      if(ok){ for(const m of (c.media||[])){ try{ await db.doc("media/"+m).delete(); }catch{} } closeModal(true); toast("Comment deleted"); schedule(); } else el.disabled=false; break; }
    case "delTopic": { const t=S.topics.get(id); if(!t||t.authorId!==S.me) break;
      openModal(`<h2 style="font-size:18px">Delete this topic?</h2><p class="muted" style="margin:0">The topic will show “Topic deleted by creator”. The discussion, reviews and branched topics stay, but new comments, reviews and votes are closed. It disappears from Home, Explore and search.</p><div class="acts"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="delTopicOk" data-id="${esc(id)}">Delete topic</button></div>`); break; }
    case "delTopicOk": { const t=S.topics.get(id); if(!t||t.authorId!==S.me) break; el.disabled=true;
      if(await W(()=>db.doc("topics/"+id).update({deletedAt:Date.now(),deletedBy:S.me}))){ closeModal(true); toast("Topic deleted"); location.hash="#home"; schedule(); } else el.disabled=false; break; }
    case "textSize": { applyTS(el.dataset.v); try{ localStorage.setItem("tt_ts",el.dataset.v); }catch{}
      const h=S.handles.get(S.me); if(h&&db){ h.textSize=el.dataset.v; try{ await db.doc("handles/"+S.me).update({textSize:el.dataset.v}); }catch{} } schedule(); break; }
    case "friendAdd": { if(!(await gate())) break; if(await W(()=>db.doc("friends/"+fKey(S.me,id)).set({fromId:S.me,toId:id,status:"pending",createdAt:Date.now()}))){ notify([[id,"friend_req"]],{text:""}); toast("Friend request sent"); } break; }
    case "friendAccept": { if(!(await gate())) break; if(await W(()=>db.doc("friends/"+fKey(id,S.me)).update({status:"accepted",acceptedAt:Date.now()}))){ notify([[id,"friend_ok"]],{text:""}); toast("You’re now friends"); } break; }
    case "friendDecline": { for(const k of [fKey(id,S.me)]) if(S.friends.has(k)) await W(()=>db.doc("friends/"+k).delete()); notify([[id,"friend_no"]],{text:""}); toast("Request rejected"); schedule(); break; }
    case "friendRemove": { for(const k of [fKey(S.me,id),fKey(id,S.me)]) if(S.friends.has(k)) await W(()=>db.doc("friends/"+k).delete()); schedule(); break; }
    case "followU": { if(!(await gate())) break; const k=fKey(S.me,id);
      if(S.ufollows.has(k)) await W(()=>db.doc("ufollows/"+k).delete());
      else if(await W(()=>db.doc("ufollows/"+k).set({followerId:S.me,followingId:id,createdAt:Date.now()}))) notify([[id,"follow"]],{text:""});
      schedule(); break; }
    case "inviteF": { if(!(await gate())) break; inviteModal(id); break; }
    case "invTick": if(el.checked) UI.inv.add(id); else UI.inv.delete(id); break;
    case "copyLink": try{ await navigator.clipboard.writeText(location.origin+"/#t-"+id); toast("Link copied"); }catch{ toast(location.origin+"/#t-"+id); } break;
    case "invSend": { const t=S.topics.get(id); const list=[...UI.inv]; if(!list.length){ toast("Pick at least one friend."); break; } el.disabled=true;
      const canAdd=accOf(t)!=="open"&&(canManageT(t)||(t.membersCanAdd&&tRoleOf(t,S.me)));
      for(const u of list){ if(accOf(t)!=="open"){ if(!canAdd) continue; await W(()=>db.doc("tmembers/"+fKey(id,u)).set({topicId:id,userId:u,role:"member",addedBy:S.me,createdAt:Date.now()})); } }
      await notify(list.map(u=>[u,accOf(t)==="open"?"invited":"added"]),{topicId:id,text:t.title});
      closeModal(true); toast(accOf(t)!=="open"&&!canAdd?"You can’t add people to this topic.":`Invited ${list.length} friend${list.length>1?"s":""}`); break; }
    case "privacy": UI.priv=null; privModal(id); break;
    case "privPick": UI.priv.acc=el.dataset.v; privModal(UI.priv.id); break;
    case "privMca": UI.priv.mca=el.checked; break;
    case "privSave": { const t=S.topics.get(id); if(!t) break; el.disabled=true; const P=UI.priv, was=accOf(t);
      const patch={access:P.acc}; if(t.authorId===S.me||S.isOwner) patch.membersCanAdd=!!P.mca;
      if(await W(()=>db.doc("topics/"+id).update(patch))){
        if(was==="open"&&P.acc!=="open"){ const ppl=new Set([...(IX.cByTopic.get(id)||[]).map(c=>c.authorId),...(IX.rByTopic.get(id)||[]).map(r=>r.authorId),...followersOf(id)]); notify([...ppl].map(u=>[u,"madeprivate"]),{topicId:id,text:t.title}); }
        toast("Saved"); UI.priv=null; setTimeout(()=>privModal(id),200); schedule(); } else el.disabled=false; break; }
    case "reqJoin": { if(!(await gate())) break; const raw=R.topics.get(id); if(await W(()=>db.doc("joinreqs/"+fKey(id,S.me)).set({topicId:id,userId:S.me,status:"pending",createdAt:Date.now()}))){ notify([[raw.authorId,"joinreq"]],{topicId:id,text:raw.title}); toast("Request sent"); schedule(); } break; }
    case "reqCancel": await W(()=>db.doc("joinreqs/"+fKey(id,S.me)).delete()); schedule(); break;
    case "reqApprove": { const u=el.dataset.u, t=S.topics.get(id); if(await W(()=>db.doc("tmembers/"+fKey(id,u)).set({topicId:id,userId:u,role:"member",addedBy:S.me,createdAt:Date.now()}))){ await W(()=>db.doc("joinreqs/"+fKey(id,u)).delete()); notify([[u,"joinok"]],{topicId:id,text:t.title}); setTimeout(()=>privModal(id),200); } break; }
    case "reqDecline": { await W(()=>db.doc("joinreqs/"+fKey(id,el.dataset.u)).delete()); setTimeout(()=>privModal(id),200); break; }
    case "memAdd": { const u=el.dataset.u, t=S.topics.get(id); if(await W(()=>db.doc("tmembers/"+fKey(id,u)).set({topicId:id,userId:u,role:"member",addedBy:S.me,createdAt:Date.now()}))){ notify([[u,"added"]],{topicId:id,text:t.title}); setTimeout(()=>privModal(id),200); } break; }
    case "memRemove": { await W(()=>db.doc("tmembers/"+fKey(id,el.dataset.u)).delete()); setTimeout(()=>privModal(id),200); break; }
    case "memAdmin": { await W(()=>db.doc("tmembers/"+fKey(id,el.dataset.u)).update({role:el.dataset.r})); setTimeout(()=>privModal(id),200); break; }
    case "leaveT": { if(await W(()=>db.doc("tmembers/"+fKey(id,S.me)).delete())){ toast("You left the topic"); location.hash="#home"; } break; }
    case "bnRemove": UI.bn=""; { const w=$("#n-bn"); if(w) w.innerHTML=""; } break;
    case "bannerEdit": bannerModal(id); break;
    case "bmRemove": UI.bn=""; { const w=$("#bm-pre"); if(w) w.innerHTML='<div class="muted">Banner will be removed when you save.</div>'; } break;
    case "bmSave": { if(UI.bn===undefined){ closeModal(false); break; } el.disabled=true; if(await W(()=>db.doc("topics/"+id).update({banner:UI.bn}))){ closeModal(true); toast(UI.bn?"Banner saved":"Banner removed"); schedule(); } else el.disabled=false; break; }
    case "dpRemove": UI.dp=""; { const o=S.handles.get(S.me); const w=$("#h-dp"); if(w){ const keep=o?.avatar; if(o) o.avatar=""; w.innerHTML=avatar(S.me,"lg"); if(o) o.avatar=keep; } } break;
    case "readAll": UI.keep=null; for(const n of S.notifs.filter(n=>!n.read)){ try{ await db.doc("notifs/"+n.id).update({read:true}); }catch{} } break;
    case "clearSample": {
      if(!el.dataset.confirm){ el.dataset.confirm="1"; el.textContent="Click again to delete all sample content"; el.classList.add("pri"); break; }
      el.disabled=true; el.textContent="Removing…"; let n=0;
      const groups=[["topics",R.topics],["comments",R.comments],["reviews",R.reviews],["battles",R.battles],["duels",R.duels],["media",S.media],["gmembers",S.gmembers],["groups",S.groups],["handles",S.handles]];
      for(const [col,m] of groups) for(const [k,d] of [...m]) if(d.seed){ try{ await db.doc(col+"/"+k).delete(); n++; }catch{} }
      toast(`Removed ${n} sample items`); break; }
  }
});
document.addEventListener("focusin",e=>{ if(e.target.matches&&e.target.matches("textarea,input")) document.documentElement.classList.add("kb"); });
document.addEventListener("focusout",()=>setTimeout(()=>{ if(!document.activeElement||!document.activeElement.matches("textarea,input")) document.documentElement.classList.remove("kb"); },150));
document.addEventListener("change", async e=>{
  if(e.target.id==="n-bfile"||e.target.id==="bm-file"){ const f=e.target.files&&e.target.files[0]; if(!f) return; const bm=e.target.id==="bm-file", err=$(bm?"#bm-err":"#n-err");
    try{ const st=await loadBanner(f); const box=$(bm?"#bm-pre":"#n-bn"); if(box) bnAdjust(box,st,err); }catch(ex){ if(err) err.textContent=ex.message||"Couldn’t use that picture."; } return; }
  if(e.target.id!=="h-file") return; const f=e.target.files&&e.target.files[0]; if(!f) return; const err=$("#h-err");
  try{
    if(!/^image\/(gif|png|jpeg|webp)$/.test(f.type)) throw new Error("Pick a PNG, JPG, WebP or GIF photo.");
    const [w,h,img]=await imgSize(await readAsDataURL(f)); if(!img) throw new Error("That file couldn’t be opened.");
    const side=Math.min(w,h), c=document.createElement("canvas"); c.width=c.height=192;
    c.getContext("2d").drawImage(img,(w-side)/2,(h-side)/2,side,side,0,0,192,192);
    UI.dp=c.toDataURL("image/jpeg",0.82); $("#h-dp").innerHTML=`<img class="av lg" src="${UI.dp}" alt="">`; if(err) err.textContent="";
  }catch(ex){ if(err) err.textContent=ex.message||"Couldn’t use that photo."; }
});
document.addEventListener("input", e=>{ if(e.target.id==="n-tagin"||e.target.id==="n-group") tagSuggest();
  if(e.target.id==="inv-q"){ const l=$("#inv-list"); if(l) l.innerHTML=invRows(e.target.value); }
  if(e.target.id==="pm-q"){ const l=$("#pm-res"); if(l) l.innerHTML=pmResults(e.target.value); }
  const id=e.target?.dataset?.wc; if(!id) return; const n=wordCount(e.target.value), el=document.getElementById(id);
  if(el){ el.textContent=`${n} / ${MAX_WORDS} words`; el.style.color=n>MAX_WORDS?"var(--danger)":""; }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"&&!epEl.hidden){ epClose(true); return; }
  if(e.key==="Escape"&&$("#modal").innerHTML) closeModal(false);
  if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)&&e.target.tagName==="TEXTAREA"){
    e.preventDefault(); const b=e.target.closest(".composer,.form,.dbox,.modal")?.querySelector(".btn.pri"); b&&b.click(); }
});
/* search */
const q=$("#q"), dd=$("#dd");
const markq=(text,v)=>{ const t=String(text), i=t.toLowerCase().indexOf(v); if(!v||i<0) return esc(t); return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+v.length))+"</mark>"+esc(t.slice(i+v.length)); };
let ddi=-1;
q.addEventListener("input",()=>{
  ddi=-1;
  const v=q.value.trim().toLowerCase(); if(!v||!IX){ dd.hidden=true; return; }
  const r=searchAll(v,6);
  let h="";
  if(qWords(v).length>=2&&r.topics.length) h+=`<a href="#search" data-act="fullSearch" class="hl"><span style="color:var(--brand-deep);font-weight:700">Get the community answer</span><span class="muted">for “${esc(q.value.trim())}”</span></a>`;
  { const sg=suggestQ(v); if(sg.length) h+=`<div class="grp">Suggestions</div>`+sg.map(x=>`<a href="#search" data-act="suggest" data-q="${esc(x)}">🔍 ${esc(x)}</a>`).join(""); }
  if(r.topics.length) h+=`<div class="grp">Topics</div>`+r.topics.map(t=>`<a href="#t-${t.id}"><div class="tile" style="--h:${catHue(t.category)};width:30px;height:30px;font-size:11px;border-radius:8px">${esc(abbr(t))}</div><span>${markq(t.title,v)}</span></a>`).join("");
  if(r.cities.length) h+=`<div class="grp">Cities</div>`+r.cities.slice(0,3).map(c=>`<a href="#city-${enc(c.slug)}">📍 ${esc(c.name)}</a>`).join("");
  if(r.tags.length) h+=`<div class="grp">Hashtags</div>`+r.tags.slice(0,4).map(x=>`<a href="#tag-${enc(x)}">#${markq(x,v.replace(/^#/,""))}</a>`).join("");
  if(r.people.length) h+=`<div class="grp">People</div>`+r.people.slice(0,4).map(id=>`<a href="#u-${esc(id)}">${avatar(id,"xs")}<span>${markq(nameOf(id),v.replace(/^@/,""))}</span>${idTag(id)}</a>`).join("");
  h+=`<a href="#search" data-act="fullSearch"><b>See all results for “${esc(q.value.trim())}”</b></a>`;
  dd.innerHTML=h; dd.hidden=false;
});
q.addEventListener("keydown",e=>{
  const items=[...dd.querySelectorAll("a")];
  if(!dd.hidden&&(e.key==="ArrowDown"||e.key==="ArrowUp")&&items.length){ e.preventDefault(); ddi=(ddi+(e.key==="ArrowDown"?1:-1)+items.length)%items.length; items.forEach((a,i)=>a.classList.toggle("kb",i===ddi)); items[ddi].scrollIntoView({block:"nearest"}); return; }
  if(e.key==="Enter"&&!e.isComposing){ UI.query=q.value; dd.hidden=true; const pick=ddi>=0&&items[ddi];
    if(pick&&!pick.matches("[data-act=fullSearch]")){ location.hash=pick.getAttribute("href").slice(1); }
    else if(location.hash==="#search") schedule(); else location.hash="search";
    q.blur(); ddi=-1; }
  if(e.key==="Escape"){ dd.hidden=true; ddi=-1; q.blur(); } });
if(innerWidth>720) q.placeholder="Ask anything… which UPI app is most reliable?";
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) dd.hidden=true; else if(e.target.closest("#dd a")){ UI.query=q.value; dd.hidden=true; if(e.target.closest("[data-act=fullSearch]")&&location.hash==="#search") schedule(); } });
window.addEventListener("hashchange", ()=>{ dd.hidden=true; epClose(); for(const k in ATT) delete ATT[k]; if($("#modal").innerHTML&&!modalResolve) $("#modal").innerHTML=""; render(); });
setInterval(()=>{ if(!document.hidden && !$("#modal").innerHTML) schedule(); }, 60000);

/* ---------- boot ---------- */
render();
(async()=>{
  const c=window.claude;
  [db,user,sampleFn,downloads]= c ? await Promise.all([c.use("db"),c.use("user"),c.use("sample"),c.use("downloads")]) : [null,null,null,null];
  if(!db){ S.dbOk=false; render(); return; }
  S.dbOk=true;
  if(user){ S.me=await user.id(); S.isOwner=await user.isOwner(); const cw=await user.can("data.write"); if(cw===false) S.readOnly=true; }
  const sub=(col,map)=>db.collection(col).onSnapshot(snap=>{ map.clear(); snap.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()})); S.ready[col]=true; schedule(); }, err=>{ console.warn(col,err); });
  sub("topics",R.topics); sub("comments",R.comments); sub("reviews",R.reviews); sub("likes",S.likes); sub("follows",S.follows); sub("handles",S.handles);
  sub("battles",R.battles); sub("groups",S.groups); sub("gmembers",S.gmembers); sub("duels",R.duels); sub("media",S.media); sub("dvotes",S.dvotes); sub("bvotes",S.bvotes); sub("pvotes",S.pvotes);
  if(S.me){ sub("friends",S.friends); sub("tmembers",S.tmembers); sub("joinreqs",S.joinreqs); sub("blocks",S.blocks); sub("reports",S.reports); } sub("ufollows",S.ufollows);
  if(S.me) db.collection("notifs").where("to","==",S.me).onSnapshot(snap=>{ S.notifs=snap.docs.map(d=>({id:d.id,...d.data()})); schedule(); },()=>{});
  render();
})();
})();

</script>
